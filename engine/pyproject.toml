[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasylab-engine"
version = "0.1.0"
description = "Original DFS projection toolkit implementing publicly documented metric definitions (clean-room)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["fantasylab_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
